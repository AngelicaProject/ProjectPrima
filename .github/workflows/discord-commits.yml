name: Prima commits to Discord

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      before:
        description: "Previous full commit SHA (exclusive)"
        required: true
        type: string
      after:
        description: "New full commit SHA (inclusive)"
        required: true
        type: string
      dry_run:
        description: "Preview without sending to Discord"
        default: true
        type: boolean

permissions:
  contents: read

# Do not cancel or replace pending runs: every push must be announced.
jobs:
  announce:
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Announce each non-merge commit
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BEFORE_SHA: ${{ inputs.before }}
          AFTER_SHA: ${{ inputs.after }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: python3 .github/scripts/discord_commits.py
